<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoufHub — Music Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #00caa8;
      --secondary: #7c5cff;
      --dark: #0a0c15;
      --text: #ffffff;
      --text-muted: #a0a8c0;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0c15 0%, #1a0f2e 100%);
      color: var(--text);
      min-height: 100vh;
    }
    
    .navbar {
      background: rgba(10, 12, 21, 0.98);
      backdrop-filter: blur(20px);
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    
    .back-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 30px;
      color: white;
      text-decoration: none;
    }
    
    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      text-align: center;
    }
    
    .album-art {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 30px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    h1 {
      font-size: 36px;
      margin-bottom: 16px;
    }
    
    .artist {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 30px;
    }
    
    .action-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }
    
    audio {
      width: 100%;
      margin-top: 20px;
    }
    
    .lyrics {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 30px;
      margin-top: 40px;
      text-align: left;
    }
    
    .lyrics h3 {
      margin-bottom: 16px;
      color: var(--primary);
    }
    
    .lyrics p {
      color: var(--text-muted);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">🎵 LoufHub</a>
      <a href="music.html" class="back-btn">← Back to Music</a>
    </div>
  </nav>
  
  <div class="container" id="musicDetail">
    <div class="loading">Loading...</div>
  </div>
  
  <script>
    const songData = JSON.parse(localStorage.getItem('selectedSong') || '{"title":"Unknown","artist":"Unknown"}');
    
    function displayMusicDetail() {
      const html = `
        <div class="album-art">🎵</div>
        <h1>${songData.title}</h1>
        <div class="artist">${songData.artist}</div>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="playFullSong()">▶ Play Full Song</button>
          <button class="btn btn-secondary" onclick="downloadAudio()">⬇ Download MP3</button>
          <button class="btn btn-secondary" onclick="shareSong()">📤 Share</button>
        </div>
        <audio id="audioPlayer" controls>
          <source src="#" type="audio/mpeg">
        </audio>
        <div class="lyrics">
          <h3>📝 Lyrics</h3>
          <p>Loading lyrics for "${songData.title}" by ${songData.artist}...<br><br>
          Full lyrics will appear here once available.<br>
          This feature is coming soon!</p>
        </div>
      `;
      document.getElementById('musicDetail').innerHTML = html;
    }
    
    function playFullSong() {
      alert(`🎵 Now playing: "${songData.title}" by ${songData.artist}\n\nEnjoy the music!`);
    }
    
    function downloadAudio() {
      alert(`⬇ Downloading "${songData.title}" by ${songData.artist}\n\nYour download will start shortly!`);
    }
    
    function shareSong() {
      alert(`📤 Share "${songData.title}" by ${songData.artist}\n\nCopy this link to share with friends!`);
    }
    
    displayMusicDetail();
  </script>
</body>
</html>
