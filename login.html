<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LoufHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700; --yellow: #FFE44D; --dark-gold: #DAA520;
            --black-deep: #0a0a0a; --black-dark: #111111; --black-soft: #1a1a1a;
            --white: #ffffff; --gray: #cccccc; --light-gray: #a0a8c0;
            --gold-gradient: linear-gradient(135deg, #FFD700, #DAA520, #FFE44D);
            --glass-bg: rgba(26, 26, 26, 0.7); --glass-border: rgba(255, 215, 0, 0.15);
            --gold-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--gold); color: var(--black-deep); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--black-deep); 
            color: var(--white); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }

        body::before { 
            content: ''; 
            position: absolute; 
            top: -50%; left: -50%; 
            width: 200%; height: 200%; 
            background: radial-gradient(circle at 30% 50%, rgba(255,215,0,0.06) 0%, transparent 50%), 
                        radial-gradient(circle at 70% 50%, rgba(218,165,32,0.04) 0%, transparent 50%); 
            animation: bgFloat 10s ease-in-out infinite alternate; 
        }
        @keyframes bgFloat { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(3deg) scale(1.05); } 
        }

        .login-card { 
            position: relative; z-index: 2; 
            width: 100%; max-width: 440px; 
            padding: 48px 40px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(30px); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            box-shadow: 0 24px 80px rgba(0,0,0,0.5); 
        }

        .logo-link { 
            display: block; 
            text-align: center; 
            margin-bottom: 32px; 
            text-decoration: none; 
        }
        .logo-text { 
            font-family: 'Playfair Display', serif; 
            font-size: 32px; font-weight: 900; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .logo-text span { 
            -webkit-text-fill-color: var(--white); 
            font-weight: 300; 
        }

        .login-card h2 { 
            font-size: 24px; font-weight: 700; 
            text-align: center; margin-bottom: 8px; 
        }
        .subtitle { 
            text-align: center; color: var(--light-gray); 
            font-size: 14px; margin-bottom: 32px; 
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; font-size: 13px; font-weight: 600; 
            margin-bottom: 8px; color: var(--gray); 
        }
        .input-wrapper { position: relative; }
        .input-wrapper i { 
            position: absolute; left: 16px; top: 50%; 
            transform: translateY(-50%); color: var(--light-gray); 
            font-size: 14px; transition: color 0.3s; 
        }
        .form-group input { 
            width: 100%; padding: 14px 16px 14px 44px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; color: var(--white); 
            font-size: 14px; outline: none; transition: all 0.3s; 
        }
        .form-group input:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 0 3px rgba(255,215,0,0.1); 
        }
        .form-group input:focus + i, 
        .form-group input:focus ~ i { /* Fallback for some structures */ }
        .input-wrapper:focus-within i { color: var(--gold); }
        .form-group input::placeholder { color: var(--light-gray); }

        .form-options { 
            display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 24px; font-size: 13px; 
        }
        .form-options label { 
            display: flex; align-items: center; gap: 6px; 
            color: var(--gray); cursor: pointer; 
        }
        .form-options label input[type="checkbox"] { accent-color: var(--gold); }
        .form-options a { 
            color: var(--gold); text-decoration: none; 
            transition: color 0.3s; font-weight: 500; 
        }
        .form-options a:hover { color: var(--yellow); }

        .login-btn { 
            width: 100%; padding: 16px; 
            background: var(--gold-gradient); 
            color: var(--black-deep); border: none; 
            border-radius: 12px; font-weight: 700; 
            font-size: 15px; cursor: pointer; 
            transition: all 0.3s; display: flex; 
            justify-content: center; align-items: center; gap: 8px; 
        }
        .login-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: var(--gold-shadow); 
        }
        .login-btn:disabled { 
            opacity: 0.7; cursor: not-allowed; 
        }

        .message { 
            padding: 12px 16px; border-radius: 10px; 
            margin-bottom: 20px; font-size: 13px; 
            display: none; align-items: center; gap: 8px; 
        }
        .message.error { 
            background: rgba(231,76,60,0.1); 
            border: 1px solid rgba(231,76,60,0.3); 
            color: #e74c3c; display: flex; 
        }
        .message.success { 
            background: rgba(46,204,113,0.1); 
            border: 1px solid rgba(46,204,113,0.3); 
            color: #2ecc71; display: flex; 
        }

        .divider { 
            display: flex; align-items: center; 
            gap: 16px; margin: 24px 0; color: var(--light-gray); 
            font-size: 12px; 
        }
        .divider::before, .divider::after { 
            content: ''; flex: 1; height: 1px; 
            background: var(--glass-border); 
        }

        .register-link { 
            text-align: center; font-size: 14px; color: var(--gray); 
        }
        .register-link a { 
            color: var(--gold); text-decoration: none; 
            font-weight: 600; transition: color 0.3s; 
        }
        .register-link a:hover { color: var(--yellow); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-icon { animation: spin 1s linear infinite; }

        @media (max-width: 767px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="index.html" class="logo-link">
            <div class="logo-text">Louf<span>Hub</span></div>
        </a>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your premium entertainment</p>

        <div class="message" id="messageBox"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <div class="form-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Sign In</span>
            </button>
        </form>

        <div class="divider">or</div>
        
        <p class="register-link">
            Don't have an account? <a href="register.html">Create one</a>
        </p>
    </div>

    <script>
        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = `message ${type}`;
            box.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${text}`;
            box.style.display = 'flex';
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            // Basic validation
            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            // Loading state
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-circle-notch spinner-icon"></i> Signing In...';

            // Simulate API Call
            setTimeout(() => {
                // Mock success (since we don't have a real auth backend)
                showMessage('Login successful! Redirecting...', 'success');
                btnText.textContent = 'Success!';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 2000);
        }
    </script>
</body>
</html>
