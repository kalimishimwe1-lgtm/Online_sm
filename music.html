<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - LoufHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700; --yellow: #FFE44D; --dark-gold: #DAA520;
            --black-deep: #0a0a0a; --black-dark: #111111; --black-soft: #1a1a1a;
            --white: #ffffff; --gray: #cccccc; --light-gray: #a0a8c0;
            --gold-gradient: linear-gradient(135deg, #FFD700, #DAA520, #FFE44D);
            --glass-bg: rgba(26, 26, 26, 0.7); --glass-border: rgba(255, 215, 0, 0.15);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); --gold-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--gold); color: var(--black-deep); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--black-deep); }
        ::-webkit-scrollbar-thumb { background: var(--dark-gold); border-radius: 4px; }
        body { font-family: 'Inter', sans-serif; background: var(--black-deep); color: var(--white); overflow-x: hidden; }

        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(20px); background: rgba(10,10,10,0.85); border-bottom: 1px solid var(--glass-border); }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .logo span { -webkit-text-fill-color: var(--white); font-weight: 300; }
        .nav-links { display: flex; gap: 30px; align-items: center; list-style: none; }
        .nav-links a { color: var(--gray); text-decoration: none; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .nav-btn { padding: 10px 24px; background: var(--gold-gradient); color: var(--black-deep); border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .mobile-toggle { display: none; background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; }

        .page-header { padding: 120px 40px 40px; text-align: center; background: linear-gradient(135deg, rgba(255,215,0,0.05), transparent); }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 900; margin-bottom: 12px; }
        .page-header p { color: var(--light-gray); }

        .main-content { padding: 40px; max-width: 1400px; margin: 0 auto; }

        .search-bar { display: flex; gap: 12px; max-width: 600px; margin: 0 auto 30px; }
        .search-bar input { flex: 1; padding: 14px 20px; background: var(--black-soft); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--white); font-size: 15px; outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: var(--gold); }
        .search-bar button { padding: 14px 24px; background: var(--gold-gradient); color: var(--black-deep); border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .search-bar button:hover { transform: translateY(-2px); box-shadow: var(--gold-shadow); }

        .genre-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; justify-content: center; }
        .genre-tab { padding: 10px 22px; background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2); border-radius: 50px; color: var(--gold); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .genre-tab:hover, .genre-tab.active { background: var(--gold); color: var(--black-deep); }

        .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .music-card { background: var(--black-soft); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.4s; border: 1px solid transparent; }
        .music-card:hover { transform: translateY(-6px); border-color: rgba(255,215,0,0.3); box-shadow: 0 15px 30px rgba(255,215,0,0.08); }
        .music-artwork { position: relative; aspect-ratio: 1; overflow: hidden; }
        .music-artwork img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .music-card:hover .music-artwork img { transform: scale(1.05); }
        .play-btn { position: absolute; bottom: 10px; right: 10px; width: 44px; height: 44px; background: var(--gold); color: var(--black-deep); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; opacity: 0; transform: translateY(10px); transition: all 0.3s; box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .music-card:hover .play-btn { opacity: 1; transform: translateY(0); }
        .download-btn { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: var(--gold); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; opacity: 0; transition: all 0.3s; }
        .music-card:hover .download-btn { opacity: 1; }
        .music-info { padding: 14px; }
        .music-info h4 { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .music-info span { font-size: 12px; color: var(--light-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        .load-more { text-align: center; margin-top: 40px; }
        .load-more button { padding: 14px 40px; background: transparent; border: 2px solid var(--gold); color: var(--gold); border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 15px; }
        .load-more button:hover { background: var(--gold); color: var(--black-deep); }

        /* AUDIO PLAYER MODAL */
        .player-modal { position: fixed; bottom: -200px; left: 0; right: 0; z-index: 2000; background: var(--black-dark); border-top: 1px solid var(--glass-border); backdrop-filter: blur(20px); padding: 20px 40px; transition: bottom 0.5s ease; }
        .player-modal.active { bottom: 0; }
        .player-content { display: flex; align-items: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .player-art { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .player-details { flex: 1; }
        .player-details h4 { font-size: 14px; font-weight: 600; }
        .player-details span { font-size: 12px; color: var(--light-gray); }
        .player-controls { display: flex; align-items: center; gap: 16px; }
        .player-controls button { background: none; border: none; color: var(--white); font-size: 18px; cursor: pointer; transition: color 0.3s; }
        .player-controls button:hover { color: var(--gold); }
        .player-controls .play-pause { width: 44px; height: 44px; background: var(--gold); color: var(--black-deep); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .player-close { background: none; border: none; color: var(--light-gray); font-size: 20px; cursor: pointer; margin-left: 20px; }

        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,215,0,0.1); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 767px) {
            .navbar { padding: 12px 20px; }
            .nav-links { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,10,10,0.98); flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
            .nav-links.active { display: flex; }
            .mobile-toggle { display: block; z-index: 1001; }
            .page-header { padding: 100px 20px 20px; }
            .page-header h1 { font-size: 28px; }
            .main-content { padding: 20px; }
            .music-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .search-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Louf<span>Hub</span></a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="movie.html">Movies</a></li>
            <li><a href="music.html" class="active">Music</a></li>
            <li><a href="sport.html">Sports</a></li>
            <li><a href="ai.html">AI Studio</a></li>
            <li><a href="login.html" class="nav-btn">Sign In</a></li>
        </ul>
        <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
    </nav>

    <div class="page-header">
        <h1>🎵 Music</h1>
        <p>Discover millions of songs across all genres</p>
    </div>

    <div class="main-content">
        <div class="search-bar">
            <input type="text" id="musicSearch" placeholder="Search songs, artists...">
            <button onclick="searchMusic()"><i class="fas fa-search"></i> Search</button>
        </div>

        <div class="genre-tabs" id="genreTabs">
            <button class="genre-tab active" data-genre="pop">Popular</button>
            <button class="genre-tab" data-genre="amapiano">Amapiano</button>
            <button class="genre-tab" data-genre="hip hop">Hip Hop</button>
            <button class="genre-tab" data-genre="r&b">R&B</button>
            <button class="genre-tab" data-genre="rock">Rock</button>
            <button class="genre-tab" data-genre="electronic">Electronic</button>
            <button class="genre-tab" data-genre="jazz">Jazz</button>
            <button class="genre-tab" data-genre="country">Country</button>
        </div>

        <div class="music-grid" id="musicGrid">
            <div class="spinner"></div>
        </div>

        <div class="load-more">
            <button onclick="loadMoreMusic()">Load More</button>
        </div>
    </div>

    <!-- AUDIO PLAYER -->
    <div class="player-modal" id="playerModal">
        <div class="player-content">
            <img class="player-art" id="playerArt" src="" alt="">
            <div class="player-details">
                <h4 id="playerTitle">Not Playing</h4>
                <span id="playerArtist">Select a song to play</span>
            </div>
            <div class="player-controls">
                <button onclick="document.getElementById('audioPlayer').currentTime -= 10"><i class="fas fa-backward"></i></button>
                <button class="play-pause" id="playPauseBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                <button onclick="document.getElementById('audioPlayer').currentTime += 10"><i class="fas fa-forward"></i></button>
            </div>
            <button class="player-close" onclick="closePlayer()"><i class="fas fa-times"></i></button>
        </div>
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        let currentGenre = 'pop';
        let currentSearch = '';

        document.getElementById('mobileToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('active');
        });

        document.querySelectorAll('.genre-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.genre-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentGenre = tab.dataset.genre;
                currentSearch = '';
                loadMusic();
            });
        });

        document.getElementById('musicSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMusic();
        });

        function searchMusic() {
            currentSearch = document.getElementById('musicSearch').value.trim();
            if (currentSearch) loadMusic();
        }

        async function loadMusic() {
            const grid = document.getElementById('musicGrid');
            grid.innerHTML = '<div class="spinner"></div>';

            try {
                let url;
                if (currentSearch) {
                    url = `/api/music/search?term=${encodeURIComponent(currentSearch)}&entity=song`;
                } else {
                    url = `/api/music/top-songs?genre=${encodeURIComponent(currentGenre)}`;
                }

                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.forEach(track => {
                        const card = document.createElement('div');
                        card.className = 'music-card';
                        card.innerHTML = `
                            <div class="music-artwork">
                                <img src="${track.artworkUrl100 || 'https://via.placeholder.com/200/1a1a1a/FFD700?text=♪'}" alt="${track.trackName}" loading="lazy">
                                <button class="play-btn" onclick="event.stopPropagation(); playTrack('${track.trackName?.replace(/'/g, "\\'")}', '${track.artistName?.replace(/'/g, "\\'")}', '${track.previewUrl || ''}', '${track.artworkUrl100 || ''}')"><i class="fas fa-play"></i></button>
                                <button class="download-btn" onclick="event.stopPropagation(); downloadTrack('${track.trackViewUrl || '#'}')"><i class="fas fa-download"></i></button>
                            </div>
                            <div class="music-info">
                                <h4>${track.trackName || 'Unknown'}</h4>
                                <span>${track.artistName || 'Unknown Artist'}</span>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            if (track.trackId) window.location.href = `clicked_music.html?id=${track.trackId}`;
                        });
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="color: var(--light-gray); text-align:center; grid-column:1/-1;">No music found. Try a different search or genre.</p>';
                }
            } catch (err) {
                grid.innerHTML = '<p style="color: var(--light-gray); text-align:center; grid-column:1/-1;">Error loading music. Please try again.</p>';
            }
        }

        function loadMoreMusic() {
            loadMusic();
        }

        // Audio player
        let isPlaying = false;
        const audioPlayer = document.getElementById('audioPlayer');

        function playTrack(title, artist, previewUrl, artwork) {
            const modal = document.getElementById('playerModal');
            document.getElementById('playerTitle').textContent = title;
            document.getElementById('playerArtist').textContent = artist;
            document.getElementById('playerArt').src = artwork;

            if (previewUrl) {
                audioPlayer.src = previewUrl;
                audioPlayer.play();
                isPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audioPlayer.src = '';
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            }
            modal.classList.add('active');
        }

        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            } else {
                audioPlayer.play();
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        }

        function closePlayer() {
            audioPlayer.pause();
            document.getElementById('playerModal').classList.remove('active');
        }

        function downloadTrack(url) {
            if (url && url !== '#') {
                window.open(url, '_blank');
            } else {
                alert('Download not available for this track');
            }
        }

        loadMusic();
    </script>
</body>
</html>
