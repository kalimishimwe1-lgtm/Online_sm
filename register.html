<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LoufHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700; --yellow: #FFE44D; --dark-gold: #DAA520;
            --black-deep: #0a0a0a; --black-dark: #111111; --black-soft: #1a1a1a;
            --white: #ffffff; --gray: #cccccc; --light-gray: #a0a8c0;
            --gold-gradient: linear-gradient(135deg, #FFD700, #DAA520, #FFE44D);
            --glass-bg: rgba(26, 26, 26, 0.7); --glass-border: rgba(255, 215, 0, 0.15);
            --gold-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            --red: #e74c3c; --orange: #f39c12; --green: #2ecc71;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--gold); color: var(--black-deep); }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--black-deep); 
            color: var(--white); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative; 
            overflow: hidden; 
        }

        body::before { 
            content: ''; 
            position: absolute; 
            top: -50%; left: -50%; 
            width: 200%; height: 200%; 
            background: radial-gradient(circle at 70% 30%, rgba(255,215,0,0.06) 0%, transparent 50%), 
                        radial-gradient(circle at 30% 70%, rgba(218,165,32,0.04) 0%, transparent 50%); 
            animation: bgFloat 12s ease-in-out infinite alternate; 
        }
        @keyframes bgFloat { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(-3deg) scale(1.05); } 
        }

        .register-card { 
            position: relative; z-index: 2; 
            width: 100%; max-width: 480px; 
            padding: 48px 40px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(30px); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            box-shadow: 0 24px 80px rgba(0,0,0,0.5); 
        }

        .logo-link { display: block; text-align: center; margin-bottom: 32px; text-decoration: none; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { -webkit-text-fill-color: var(--white); font-weight: 300; }

        .register-card h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: var(--light-gray); font-size: 14px; margin-bottom: 32px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--gray); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--light-gray); font-size: 14px; transition: color 0.3s; }
        .input-wrapper:focus-within i { color: var(--gold); }
        
        .form-group input { 
            width: 100%; padding: 14px 16px 14px 44px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; color: var(--white); 
            font-size: 14px; outline: none; transition: all 0.3s; 
        }
        .form-group input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
        .form-group input::placeholder { color: var(--light-gray); }
        .form-group input.invalid { border-color: var(--red); }
        .form-group input.valid { border-color: var(--green); }

        /* Password Strength Indicator */
        .password-strength { margin-top: 10px; }
        .strength-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
        .strength-fill { height: 100%; width: 0%; border-radius: 4px; transition: all 0.4s ease; }
        .strength-text { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .form-check { 
            display: flex; align-items: flex-start; gap: 10px; 
            margin-bottom: 24px; font-size: 13px; color: var(--gray); 
        }
        .form-check input { margin-top: 2px; accent-color: var(--gold); cursor: pointer; }
        .form-check a { color: var(--gold); text-decoration: none; }

        .register-btn { 
            width: 100%; padding: 16px; 
            background: var(--gold-gradient); 
            color: var(--black-deep); border: none; 
            border-radius: 12px; font-weight: 700; 
            font-size: 15px; cursor: pointer; 
            transition: all 0.3s; display: flex; 
            justify-content: center; align-items: center; gap: 8px; 
        }
        .register-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--gold-shadow); }
        .register-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .message { 
            padding: 12px 16px; border-radius: 10px; 
            margin-bottom: 20px; font-size: 13px; 
            display: none; align-items: center; gap: 8px; 
        }
        .message.error { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; display: flex; }
        .message.success { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; display: flex; }

        .login-link { text-align: center; font-size: 14px; color: var(--gray); margin-top: 24px; }
        .login-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
        .login-link a:hover { color: var(--yellow); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-icon { animation: spin 1s linear infinite; }

        @media (max-width: 767px) {
            .register-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <a href="index.html" class="logo-link">
            <div class="logo-text">Louf<span>Hub</span></div>
        </a>
        <h2>Create Account</h2>
        <p class="subtitle">Join the ultimate entertainment experience</p>

        <div class="message" id="messageBox"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" placeholder="Enter your name" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Create a password" required oninput="checkPasswordStrength(this.value)">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="password-strength">
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required oninput="checkPasswordMatch()">
                    <i class="fas fa-shield-halved"></i>
                </div>
            </div>
            <div class="form-check">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
            </div>
            <button type="submit" class="register-btn" id="registerBtn">
                <span id="btnText">Create Account</span>
            </button>
        </form>

        <p class="login-link">
            Already have an account? <a href="login.html">Sign In</a>
        </p>
    </div>

    <script>
        // Password Strength Checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            
            if (password.length === 0) {
                fill.style.width = '0%';
                fill.style.background = 'transparent';
                text.textContent = '';
                return;
            }

            if (password.length >= 6) strength += 25;
            if (password.length >= 10) strength += 25;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password) || /[^A-Za-z0-9]/.test(password)) strength += 25;

            if (strength <= 25) {
                fill.style.width = '33%';
                fill.style.background = 'var(--red)';
                text.textContent = 'Weak';
                text.style.color = 'var(--red)';
            } else if (strength <= 50) {
                fill.style.width = '66%';
                fill.style.background = 'var(--orange)';
                text.textContent = 'Medium';
                text.style.color = 'var(--orange)';
            } else {
                fill.style.width = '100%';
                fill.style.background = 'var(--green)';
                text.textContent = 'Strong';
                text.style.color = 'var(--green)';
            }
            
            checkPasswordMatch();
        }

        // Real-time Password Match Validation
        function checkPasswordMatch() {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword');
            
            if (confirm.value.length === 0) {
                confirm.classList.remove('valid', 'invalid');
                return;
            }

            if (pass === confirm.value) {
                confirm.classList.remove('invalid');
                confirm.classList.add('valid');
            } else {
                confirm.classList.remove('valid');
                confirm.classList.add('invalid');
            }
        }

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = `message ${type}`;
            box.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${text}`;
            box.style.display = 'flex';
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const btn = document.getElementById('registerBtn');
            const btnText = document.getElementById('btnText');

            // Validation
            if (!name || !email || !password || !confirmPassword) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            if (!terms) {
                showMessage('You must agree to the terms and conditions', 'error');
                return;
            }

            // Loading state
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-circle-notch spinner-icon"></i> Creating Account...';

            // Simulate API Call
            setTimeout(() => {
                showMessage('Account created successfully! Redirecting to login...', 'success');
                btnText.textContent = 'Success!';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }, 2500);
        }
    </script>
</body>
</html>
